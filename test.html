<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>iOS 风格演示</title>
  <link id="theme-style" rel="stylesheet" href="Scriptforge-css.css">
  <script src="Scriptforge-js.js"></script>
  <style>
    .switchTheme{
      display: block;
      margin-left: auto; 
    }
    .mt-8 {
      margin-top: 8px;
    }
    .mt-12 {
      margin-top: 12px;
    }
  </style>

</head>
<body>  
  <div class="page-wrapper">

    <sf-toast id="toast"></sf-toast>

    <!-- 顶部菜单 -->
    <sf-menu>
      <li>
        <a href="#home" class="menu-link">
          <span class="icon">🏠</span>
          <span class="label">首页</span>
        </a>
      </li>
      <li>
        <a href="#explore" class="menu-link">
          <span class="icon">🔍</span>
          <span class="label">发现</span>
        </a>
      </li>
      <li>
        <a href="#messages" class="menu-link">
          <span class="icon">💬</span>
          <span class="label">消息</span>
        </a>
      </li>
      <li>
        <a href="#profile" class="menu-link active">
         <span class="icon">👤</span>
         <span class="label">我的</span>
        </a>
      </li>
      <!-- 修复axe/structure警告：ul内部不能直接放div，套入li标签 -->
      <li class="switchTheme">
        <button id="toggle-theme">切换主题</button>
      </li>
    </sf-menu>
    
    <main>
      <h1 class="card">欢迎使用</h1>

      <div class="card">
        <h2>表单示例</h2>
        <h3>登录</h3>
        <label for="email">邮箱</label>
        <input type="email" id="email" placeholder="your@email.com" />

        <label for="password">密码</label>
        <input type="password" id="password" placeholder="输入密码" />

        <!-- 替换 style="margin-top:8px;" → mt-8 -->
        <div class="flex gap-4 mt-8">
          <button onclick="toast.showToast('登录成功！')">登录</button>
          <button class="btn-secondary" onclick="toast.showToast('已取消')">取消</button>
        </div> 
      </div>
      
      <div class="card">
        <h2>卡片列表</h2>
        <h3>今日任务</h>
        <p>完成前端页面设计，优化交互体验。</p>
        <!-- 替换 style="margin-top:12px;" → mt-12 -->
        <div class="flex gap-4 mt-12">
          <button class="btn-success" onclick="toast.showToast('任务已完成')">✓ 完成</button>
          <button class="btn-error" onclick="toast.showToast('任务已删除')">🗑 删除</button>
        </div>
        <h3>反馈建议</h3>
        <textarea placeholder="请输入您的建议..."></textarea>
        <button onclick="toast.showToast('感谢反馈！')">提交反馈</button>
      </div>

      <div class="card">
        <h2>卡片列表</h2>
        <h3>今日任务</h3>
        <p>完成前端页面设计，优化交互体验。</p>
        <div class="flex gap-4 mt-12">
          <button class="btn-success" onclick="toast.showToast('任务已完成')">✓ 完成</button>
          <button class="btn-error" onclick="toast.showToast('任务已删除')">🗑 删除</button>
        </div>

        <div>
          <h3>反馈建议</h3>
          <textarea placeholder="请输入您的建议..."></textarea>
          <button onclick="toast.showToast('感谢反馈！')">提交反馈</button>
        </div>
      </div>

      
      <div class="card">
        <h2>状态展示</h2>
        <h3>状态展示</h3>
        <h4>状态展示</h4>
        <h5>状态展示</h5>
        <h6>状态展示</h6>
        <p class="success">✅ 操作成功：数据已保存</p>
        <!-- 替换行内margin-top:8px为mt-8类 -->
        <p class="error mt-8">❌ 操作失败：网络连接超时</p>
      </div>
    </main>

    <!-- 底部菜单 -->
    <sf-menu>
      <li>
        <a href="#home" class="menu-link">
          <span class="icon">🏠</span>
          <span class="label">首页</span>
        </a>
      </li>
      <li>
        <a href="#explore" class="menu-link">
          <span class="icon">🔍</span>
          <span class="label">发现</span>
        </a>
      </li>
      <li>
        <a href="#messages" class="menu-link">
          <span class="icon">💬</span>
          <span class="label">消息</span>
        </a>
      </li>
      <li>
        <a href="#profile" class="menu-link">
          <span class="icon">👤</span>
          <span class="label">我的</span>
        </a>
      </li>
    </sf-menu>
  </div>
  

  <script>
    resetCardReveal();
    revealCardsSequentially(50);
    changeTheme();

  </script>
</body>
</html>
