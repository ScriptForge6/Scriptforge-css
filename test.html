<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>iOS 风格演示</title>
  <link rel="stylesheet" href="Scriptforge-css.css" />
</head>
<body>
  <div class="page-wrapper">
    <!-- 顶部菜单 -->
    <nav class="menu menu-top" role="navigation" aria-label="主导航">
      <ul class="menu-list">
        <li>
          <a href="#home" class="menu-link active">
            <span class="icon">🏠</span>
            <span class="label">首页</span>
          </a>
        </li>
        <li>
          <a href="#explore" class="menu-link">
            <span class="icon">🔍</span>
            <span class="label">发现</span>
          </a>
        </li>
        <li>
          <a href="#messages" class="menu-link">
            <span class="icon">💬</span>
            <span class="label">消息</span>
          </a>
        </li>
        <li>
          <a href="#profile" class="menu-link">
            <span class="icon">👤</span>
            <span class="label">我的</span>
          </a>
        </li>
      </ul>
    </nav>

    <main>
      <h1>欢迎使用</h1>

      <h2>表单示例</h2>
      <div class="card visible">
        <h3>登录</h3>
        <label for="email">邮箱</label>
        <input type="email" id="email" placeholder="your@email.com" />

        <label for="password">密码</label>
        <input type="password" id="password" placeholder="输入密码" />

        <div class="flex gap-4" style="margin-top: 8px;">
          <button onclick="showToast('登录成功！', 'success')">登录</button>
          <button class="btn-secondary" onclick="showToast('已取消')">取消</button>
        </div>
        <div id="status" role="status" class="success"></div>
      </div>

      <h2>卡片列表</h2>
      <div class="card visible">
        <h3>今日任务</h3>
        <p class="text-secondary">完成前端页面设计，优化交互体验。</p>
        <div class="flex gap-4" style="margin-top: 12px;">
          <button class="btn-success" onclick="showToast('任务已完成', 'success')">✓ 完成</button>
          <button class="btn-error" onclick="showToast('任务已删除', 'error')">🗑 删除</button>
        </div>
      </div>

      <div class="card visible">
        <h3>反馈建议</h3>
        <textarea placeholder="请输入您的建议..."></textarea>
        <button onclick="showToast('感谢反馈！', 'success')">提交反馈</button>
      </div>

      <h2>状态展示</h2>
      <div class="card visible">
        <p class="success">✅ 操作成功：数据已保存</p>
        <p class="error" style="margin-top: 8px;">❌ 操作失败：网络连接超时</p>
      </div>
    </main>

    <!-- 底部菜单 -->
    <nav class="menu menu-bottom" role="navigation" aria-label="底部导航">
      <ul class="menu-list">
        <li>
          <a href="#home" class="menu-link active">
            <span class="icon">🏠</span>
            <span class="label">首页</span>
          </a>
        </li>
        <li>
          <a href="#explore" class="menu-link">
            <span class="icon">🔍</span>
            <span class="label">发现</span>
          </a>
        </li>
        <li>
          <a href="#messages" class="menu-link">
            <span class="icon">💬</span>
            <span class="label">消息</span>
          </a>
        </li>
        <li>
          <a href="#profile" class="menu-link">
            <span class="icon">👤</span>
            <span class="label">我的</span>
          </a>
        </li>
      </ul>
    </nav>

    <!-- Toast 提示 -->
    <div id="toast" class="toast"></div>
  </div>

  <script>
    function showToast(message, type) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');

      const status = document.getElementById('status');
      if (status && type) {
        status.textContent = message;
        status.className = type === 'success' ? 'success' : 'error';
      }

      setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }

    document.addEventListener('DOMContentLoaded', () => {
      const cards = document.querySelectorAll('.card');
      cards.forEach((card, index) => {
        setTimeout(() => {
          card.classList.add('visible');
        }, index * 100);
      });
    });
  </script>
</body>
</html>
